<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6db33f" />
    <title>Yürüyom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Nunito, sans-serif;
        background: #f7faf3;
        color: #1c1c1c;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      .brand span { color: #6db33f; }
      p.lede {
        margin: 10px 0 28px;
        color: #4b5563;
        font-weight: 700;
      }
      .cards {
        display: grid;
        gap: 16px;
      }
      a.card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 16px;
        padding: 22px 22px 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      }
      a.card:hover { border-color: #cfe8b8; background: #f3faeb; }
      .step {
        display: inline-block;
        background: #e7f6df;
        color: #246b12;
        font-weight: 800;
        font-size: 12px;
        border-radius: 999px;
        padding: 4px 9px;
      }
      h2 {
        margin: 10px 0 6px;
        font-size: 22px;
        letter-spacing: -0.03em;
      }
      a.card p { margin: 0; color: #4b5563; font-weight: 600; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span>y</span>ürüyom</div>
      <p class="lede">İki adım da burada. Birini seç, index.html gibi tarayıcıda açılır.</p>
      <div class="cards">
        <a class="card" href="./adim-1/">
          <span class="step">1. adım</span>
          <h2>Türkiye rotaları</h2>
          <p>Doğa yürüyüşü, bisiklet ve kamp rotaları. Sol listede rota, sağda harita.</p>
        </a>
        <a class="card" href="./adim-2/">
          <span class="step">2. adım</span>
          <h2>Kahramanmaraş kamp ve doğa</h2>
          <p>Yayla, kamp ve doğal alanlar. Fotoğraf, kısa video, yorum ve fotoğraf bırakma.</p>
        </a>
      </div>
    </main>
  </body>
</html>
